<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CLAT Express Study Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Concept: a study desk. Cool paper ground, indigo ink for structure, marigold for memory aids.
   Display: Bricolage Grotesque (headings); reading text: Source Serif 4 (passages); UI: Hanken Grotesk. */
:root{
  --bg:#f3f5fa; --surface:#ffffff; --surface-2:#eaeef7; --fg:#141a33; --muted:#59627f; --line:#d5dbea;
  --ink:#2b3a9e; --ink-soft:#e4e8fb; --gold:#e8a10c; --gold-soft:#fdf1d3;
  --good:#16885a; --good-soft:#dcf3e8; --bad:#c93a52; --bad-soft:#fbe0e5;
  --ui:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"Bricolage Grotesque","Hanken Grotesk",system-ui,sans-serif;
  --read:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1226; --surface:#161c38; --surface-2:#1e2647; --fg:#e8ebf8; --muted:#9aa3c4; --line:#2c3560;
  --ink:#8f9dff; --ink-soft:#242d62; --gold:#f2b83a; --gold-soft:#3a3016;
  --good:#4cc593; --good-soft:#143a2c; --bad:#ff7a90; --bad-soft:#44202b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1226; --surface:#161c38; --surface-2:#1e2647; --fg:#e8ebf8; --muted:#9aa3c4; --line:#2c3560;
  --ink:#8f9dff; --ink-soft:#242d62; --gold:#f2b83a; --gold-soft:#3a3016;
  --good:#4cc593; --good-soft:#143a2c; --bad:#ff7a90; --bad-soft:#44202b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 28px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;padding-block:18px 8px}
.top h1{font-family:var(--display);font-size:1.55rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
.top p{margin:0;color:var(--muted);font-size:.9rem}
.modes{display:flex;gap:6px;overflow-x:auto;padding-block:8px;scrollbar-width:thin;border-bottom:1px solid var(--line)}
.modes button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:500;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.modes .n{font-variant-numeric:tabular-nums;opacity:.75;margin-left:6px;font-size:.8rem}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding-block:14px}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:0}
.filters select,.filters input{height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 10px;font-size:.92rem;text-transform:none;letter-spacing:0;color:var(--fg);min-width:0;width:100%}
.filters .reset{align-self:end;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-weight:500}
.crumb{color:var(--muted);font-size:.85rem;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0;text-align:left;display:flex;flex-direction:column;gap:6px}
button.card:hover{border-color:var(--ink)}
.card h3{font-family:var(--display);font-size:1.05rem;margin:0;line-height:1.25}
.card p{margin:0;color:var(--muted);font-size:.9rem}
.tag{display:inline-block;font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink);background:var(--ink-soft);border-radius:6px;padding:2px 7px;margin-right:6px}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:12px}
.sub h3{font-family:var(--display);margin:0 0 4px}
.sub ul{margin:8px 0 0;padding-left:18px}
.sub li{margin:3px 0}
.kw{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.kw span{background:var(--surface-2);border-radius:6px;padding:2px 8px;font-size:.8rem}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 12px;font-weight:500}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.empty{border:1px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--muted)}
.err{border:1px solid var(--bad);background:var(--bad-soft);border-radius:12px;padding:16px}
/* mind map */
.mmbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.mmbar select{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 10px;max-width:100%}
.mm-wrap{position:relative;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;max-height:72vh}
.mm-root{position:relative;display:inline-block;min-width:100%}
.mm-lines{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.mm-lines path{fill:none;stroke:var(--line);stroke-width:1.6}
.br{display:flex;align-items:center;gap:44px}
.kids{display:flex;flex-direction:column;gap:12px}
.nd{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:7px 12px;max-width:230px;font-size:.88rem;line-height:1.35;position:relative}
.nd.has{cursor:pointer;padding-right:26px}
.nd.has::after{content:"";position:absolute;right:9px;top:50%;width:6px;height:6px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg)}
.collapsed>.nd.has::after{transform:translateY(-50%) rotate(-45deg)}
.d0{background:var(--ink);border-color:var(--ink);color:#fff;font-family:var(--display);font-weight:700;font-size:1rem;max-width:260px}
.d0.has::after{border-color:#fff}
.d1{background:var(--ink-soft);border-color:var(--ink);font-weight:600}
.d2{background:var(--surface-2)}
.d3,.d4{background:var(--surface)}
/* mnemonics */
.mn{background:var(--gold-soft);border:1px solid var(--gold);border-radius:12px;padding:16px}
.mn .phrase{font-family:var(--display);font-size:1.5rem;line-height:1.25;margin:6px 0 12px;text-wrap:balance}
.mn table{border-collapse:collapse;width:100%;font-size:.92rem}
.mn td{padding:5px 8px;border-top:1px solid var(--gold);vertical-align:top}
.mn td:first-child{font-weight:700;width:34%;font-family:var(--display)}
/* quiz */
.qwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;height:calc(100vh - 150px);min-height:480px}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:auto;min-width:0}
.pane.pas{padding:18px 22px}
.pane.pas h2{font-family:var(--display);font-size:1.15rem;margin:0 0 10px}
.pane.pas .pt{font-family:var(--read);font-size:1.02rem;line-height:1.7;max-width:68ch;white-space:pre-line}
.pane.qs{display:flex;flex-direction:column}
.qhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.qbody{padding:16px;flex:1;overflow:auto}
.qbody h3{font-family:var(--read);font-weight:600;font-size:1.06rem;line-height:1.55;margin:0 0 14px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.opt:hover{border-color:var(--ink)}
.opt .l{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-weight:600;font-size:.82rem}
.opt[aria-checked="true"]{border-color:var(--ink);background:var(--ink-soft)}
.opt[aria-checked="true"] .l{background:var(--ink);color:#fff}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.tita{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 14px;font-size:1.05rem}
.qfoot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--line)}
.pal{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;border-top:1px solid var(--line)}
.pal button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-variant-numeric:tabular-nums;font-weight:600}
.pal .cur{outline:2px solid var(--ink)}
.pal .sv{background:var(--good-soft);border-color:var(--good)}
.pal .ok{background:var(--good-soft);border-color:var(--good)}
.pal .no{background:var(--bad-soft);border-color:var(--bad)}
.expl{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:.92rem}
.score{font-family:var(--display);font-size:2.2rem;margin:4px 0}
.confirm{margin:0 16px 12px;padding:10px 12px;border:1px solid var(--gold);background:var(--gold-soft);border-radius:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
@media (max-width:820px){
  .qwrap{grid-template-columns:1fr;height:auto}
  .pane.pas{max-height:42vh}
  .pane.qs{min-height:60vh}
}
@media (prefers-reduced-motion:no-preference){.card,.opt,.btn{transition:border-color .15s,background .15s}}
</style>

<header class="top"><h1>CLAT Express Study Hub</h1><p id="sub">Current affairs from the monthly CLAT Express booklets</p></header>
<nav class="modes" id="modes" aria-label="Study modes"></nav>
<section class="filters" id="filters" aria-label="Filters"></section>
<main id="view" aria-live="polite"></main>

<script>
(function(){
"use strict";
var MODES=[["month","Month"],["chapter","Chapters"],["topic","Topics"],["subtopic","Sub-topics"],["mindmap","Mind-maps"],["mnemonic","Mnemonics"],["mcq","MCQ Quizzes"],["tita","TITA Quizzes"]];
var DB={months:[],chapters:[],topics:[],subtopics:[],mindmaps:[],mnemonics:[],quizzes:[],node:{}};
var F={month:"",chapter:"",topic:"",subtopic:"",q:""};
var mode="month", mmSel="", quiz=null;
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function store(k,v){try{if(v===undefined)return localStorage.getItem("clx:"+k);localStorage.setItem("clx:"+k,v)}catch(e){return null}}

/* ---------- data ---------- */
function load(){
  return fetch("data/index.json").then(function(r){if(!r.ok)throw new Error("index.json "+r.status);return r.json()})
  .then(function(ix){return Promise.all(ix.months.map(function(m){return fetch("data/"+m.file).then(function(r){if(!r.ok)throw new Error(m.file+" "+r.status);return r.json()})}))})
  .then(function(files){files.forEach(ingest)});
}
function ingest(d){
  var m=d.month; DB.months.push(m); DB.node[m.id]={level:"month",month:m.id,title:m.label};
  (d.chapters||[]).forEach(function(c){
    var ch={id:c.id,title:c.title,month:m.id,n:(c.topics||[]).length}; DB.chapters.push(ch);
    DB.node[c.id]={level:"chapter",month:m.id,chapter:c.id,title:c.title};
    (c.topics||[]).forEach(function(t){
      var tp={id:t.id,title:t.title,chapter:c.id,month:m.id,n:(t.subtopics||[]).length}; DB.topics.push(tp);
      DB.node[t.id]={level:"topic",month:m.id,chapter:c.id,topic:t.id,title:t.title};
      (t.subtopics||[]).forEach(function(s){
        DB.subtopics.push({id:s.id,title:s.title,summary:s.summary||"",facts:s.facts||[],keywords:s.keywords||[],topic:t.id,chapter:c.id,month:m.id});
        DB.node[s.id]={level:"subtopic",month:m.id,chapter:c.id,topic:t.id,subtopic:s.id,title:s.title};
      });
    });
  });
  (d.mindmaps||[]).forEach(function(x){x.ctx=DB.node[x.ref]||{month:m.id};DB.mindmaps.push(x)});
  (d.mnemonics||[]).forEach(function(x){x.ctx=DB.node[x.ref]||{month:m.id};DB.mnemonics.push(x)});
  (d.quizzes||[]).forEach(function(x){x.ctx=DB.node[x.subtopic||x.topic||x.chapter||x.ref]||{month:m.id};DB.quizzes.push(x)});
}

/* ---------- filtering ---------- */
var LV=["month","chapter","topic","subtopic"];
function fits(ctx){
  for(var i=0;i<LV.length;i++){var k=LV[i];if(F[k]&&ctx[k]!==F[k])return false}
  return true;
}
function textOf(o){return (o.title+" "+(o.summary||"")+" "+(o.facts||[]).join(" ")+" "+(o.keywords||[]).join(" ")+" "+(o.mnemonic||"")+" "+(o.passage||"")).toLowerCase()}
function hit(o){return !F.q||textOf(o).indexOf(F.q.toLowerCase())>-1}
function list(kind){
  var out=[];
  if(kind==="month")out=DB.months.filter(function(m){return (!F.month||m.id===F.month)&&hit({title:m.label})});
  if(kind==="chapter")out=DB.chapters.filter(function(c){return fits({month:c.month,chapter:c.id})&&hit(c)});
  if(kind==="topic")out=DB.topics.filter(function(t){return fits({month:t.month,chapter:t.chapter,topic:t.id})&&hit(t)});
  if(kind==="subtopic")out=DB.subtopics.filter(function(s){return fits({month:s.month,chapter:s.chapter,topic:s.topic,subtopic:s.id})&&hit(s)});
  if(kind==="mindmap")out=DB.mindmaps.filter(function(x){return fits(x.ctx)&&hit({title:x.title+" "+JSON.stringify(x.root)})});
  if(kind==="mnemonic")out=DB.mnemonics.filter(function(x){return fits(x.ctx)&&hit(x)});
  if(kind==="mcq"||kind==="tita")out=DB.quizzes.filter(function(x){return x.type.toLowerCase()===kind&&fits(x.ctx)&&hit(x)});
  return out;
}

/* ---------- chrome ---------- */
function drawModes(){
  $("#modes").innerHTML=MODES.map(function(m){return '<button type="button" data-mode="'+m[0]+'" aria-pressed="'+(mode===m[0])+'">'+m[1]+'<span class="n">'+list(m[0]).length+'</span></button>'}).join("");
}
function opts(arr,val,label){return '<option value="">'+label+'</option>'+arr.map(function(o){return '<option value="'+esc(o.id)+'"'+(o.id===val?" selected":"")+'>'+esc(o.title||o.label)+'</option>'}).join("")}
function drawFilters(){
  var ms=DB.months.map(function(m){return {id:m.id,title:m.label}});
  var chs=DB.chapters.filter(function(c){return !F.month||c.month===F.month});
  var tps=DB.topics.filter(function(t){return (!F.month||t.month===F.month)&&(!F.chapter||t.chapter===F.chapter)});
  var sts=DB.subtopics.filter(function(s){return (!F.month||s.month===F.month)&&(!F.chapter||s.chapter===F.chapter)&&(!F.topic||s.topic===F.topic)});
  $("#filters").innerHTML=
   '<label>Month<select id="f-month">'+opts(ms,F.month,"All months")+'</select></label>'+
   '<label>Chapter<select id="f-chapter">'+opts(chs,F.chapter,"All chapters")+'</select></label>'+
   '<label>Topic<select id="f-topic">'+opts(tps,F.topic,"All topics")+'</select></label>'+
   '<label>Sub-topic<select id="f-subtopic">'+opts(sts,F.subtopic,"All sub-topics")+'</select></label>'+
   '<label>Search<input id="f-q" type="search" placeholder="Words, names, places" value="'+esc(F.q)+'"></label>'+
   '<button type="button" class="reset" id="f-reset">Reset filters</button>';
}
function crumb(){
  var p=[];LV.forEach(function(k){if(F[k]&&DB.node[F[k]])p.push(esc(DB.node[F[k]].title))});
  return '<p class="crumb">'+(p.length?p.join(" › "):"Showing everything")+(F.q?' · search “'+esc(F.q)+'”':"")+'</p>';
}

/* ---------- views ---------- */
function counts(mid){
  var q=DB.quizzes.filter(function(x){return x.ctx.month===mid});
  return DB.chapters.filter(function(c){return c.month===mid}).length+" chapters · "+DB.topics.filter(function(t){return t.month===mid}).length+" topics · "+DB.subtopics.filter(function(s){return s.month===mid}).length+" sub-topics · "+DB.mindmaps.filter(function(x){return x.ctx.month===mid}).length+" mind-maps · "+q.filter(function(x){return x.type==="MCQ"}).length+" MCQ · "+q.filter(function(x){return x.type==="TITA"}).length+" TITA";
}
function emptyMsg(t){return '<div class="empty">'+t+'</div>'}
function view(){
  drawModes();
  var h=crumb(),L=list(mode);
  if(mode==="month"){
    h+=L.length?'<div class="grid">'+L.map(function(m){return '<button type="button" class="card" data-pick="month:'+m.id+'"><span><span class="tag">Month</span></span><h3>'+esc(m.label)+'</h3><p class="stats">'+esc(counts(m.id))+'</p><p>'+esc(m.source||"")+'</p></button>'}).join("")+'</div>':emptyMsg("No months match.");
  }else if(mode==="chapter"){
    h+=L.length?'<div class="grid">'+L.map(function(c){return '<button type="button" class="card" data-pick="chapter:'+c.id+'"><span><span class="tag">'+esc(DB.node[c.id].month)+'</span></span><h3>'+esc(c.title)+'</h3><p class="stats">'+c.n+' topics</p></button>'}).join("")+'</div>':emptyMsg("No chapters match these filters.");
  }else if(mode==="topic"){
    h+=L.length?'<div class="grid">'+L.map(function(t){var c=DB.node[t.chapter];return '<button type="button" class="card" data-pick="topic:'+t.id+'"><span><span class="tag">'+esc(c?c.title:"")+'</span></span><h3>'+esc(t.title)+'</h3><p class="stats">'+t.n+' sub-topics</p></button>'}).join("")+'</div>':emptyMsg("No topics match these filters.");
  }else if(mode==="subtopic"){
    h+=L.length?'<div class="list">'+L.map(function(s){
      var mm=DB.mindmaps.filter(function(x){return x.ref===s.id}).length,mn=DB.mnemonics.filter(function(x){return x.ref===s.id}).length,qz=DB.quizzes.filter(function(x){return x.subtopic===s.id}).length;
      return '<article class="card sub"><h3>'+esc(s.title)+'</h3><p>'+esc(s.summary)+'</p>'+(s.facts.length?'<ul>'+s.facts.map(function(f){return '<li>'+esc(f)+'</li>'}).join("")+'</ul>':"")+(s.keywords.length?'<div class="kw">'+s.keywords.map(function(k){return '<span>'+esc(k)+'</span>'}).join("")+'</div>':"")+
      '<div class="actions"><button class="btn" data-go="mindmap:'+s.id+'"'+(mm?"":" disabled")+'>Mind-map</button><button class="btn" data-go="mnemonic:'+s.id+'"'+(mn?"":" disabled")+'>Mnemonic</button><button class="btn primary" data-go="mcq:'+s.id+'"'+(qz?"":" disabled")+'>Practise</button></div></article>'}).join("")+'</div>':emptyMsg("No sub-topics match these filters.");
  }else if(mode==="mindmap"){
    if(!L.length){h+=emptyMsg("No mind-maps match these filters yet.")}
    else{
      if(!L.some(function(x){return x.id===mmSel}))mmSel=L[0].id;
      var cur=L.filter(function(x){return x.id===mmSel})[0];
      h+='<div class="mmbar"><select id="mm-pick" aria-label="Choose a mind-map">'+L.map(function(x){return '<option value="'+esc(x.id)+'"'+(x.id===mmSel?" selected":"")+'>'+esc(x.title)+' ('+x.scope+')</option>'}).join("")+'</select><button class="btn" id="mm-all">Expand all</button><button class="btn" id="mm-none">Collapse to first level</button></div><div class="mm-wrap"><div class="mm-root" id="mm-root"><svg class="mm-lines" id="mm-svg"></svg>'+mmHtml(cur.root,0)+'</div></div>';
    }
  }else if(mode==="mnemonic"){
    h+=L.length?'<div class="list">'+L.map(function(x){return '<article class="mn"><span class="tag">'+esc(x.scope)+'</span><strong>'+esc(x.title)+'</strong><div class="phrase">'+esc(x.mnemonic)+'</div><table>'+(x.decode||[]).map(function(d){return '<tr><td>'+esc(d.key)+'</td><td>'+esc(d.meaning)+'</td></tr>'}).join("")+'</table></article>'}).join("")+'</div>':emptyMsg("No mnemonics match these filters yet.");
  }else{
    h+=L.length?'<div class="grid">'+L.map(function(x){var s=store("best:"+x.id);return '<button type="button" class="card" data-quiz="'+x.id+'"><span><span class="tag">'+x.type+'</span></span><h3>'+esc(x.title)+'</h3><p class="stats">'+x.questions.length+' questions'+(s?" · last score "+esc(s):"")+'</p><p>'+esc(x.ctx.title||"")+'</p></button>'}).join("")+'</div>':emptyMsg("No "+mode.toUpperCase()+" quizzes match these filters yet.");
  }
  $("#view").innerHTML=h;
  if(mode==="mindmap")requestAnimationFrame(drawLines);
}

/* ---------- mind map ---------- */
function mmHtml(n,d){
  var k=n.children||[];
  return '<div class="br'+(d>0&&k.length&&d>=2?" collapsed":"")+'"><div class="nd d'+Math.min(d,4)+(k.length?" has":"")+'">'+esc(n.label)+'</div>'+(k.length?'<div class="kids"'+(d>=2?" hidden":"")+'>'+k.map(function(c){return mmHtml(c,d+1)}).join("")+'</div>':"")+'</div>';
}
function drawLines(){
  var root=$("#mm-root"),svg=$("#mm-svg");if(!root||!svg)return;
  var rr=root.getBoundingClientRect(),p="";
  svg.setAttribute("width",root.scrollWidth);svg.setAttribute("height",root.scrollHeight);
  root.querySelectorAll(".br").forEach(function(br){
    var nd=br.children[0],kids=br.children[1];if(!kids||kids.hidden)return;
    var a=nd.getBoundingClientRect(),x1=a.right-rr.left,y1=a.top+a.height/2-rr.top;
    Array.prototype.forEach.call(kids.children,function(cb){
      var b=cb.children[0].getBoundingClientRect(),x2=b.left-rr.left,y2=b.top+b.height/2-rr.top,mx=(x1+x2)/2;
      p+='<path d="M'+x1+' '+y1+' C'+mx+' '+y1+' '+mx+' '+y2+' '+x2+' '+y2+'"/>';
    });
  });
  svg.innerHTML=p;
}
function mmSet(open){
  document.querySelectorAll("#mm-root .br").forEach(function(br){
    var nd=br.children[0],kids=br.children[1];if(!kids)return;
    var depth=parseInt(nd.className.match(/d(\d)/)[1],10);
    var show=open||depth<1;kids.hidden=!show;br.classList.toggle("collapsed",!show);
  });
  drawLines();
}

/* ---------- quiz ---------- */
function norm(s){return String(s).toLowerCase().replace(/[,₹$%]/g,"").replace(/\b(per ?cent|percent|percentage|billion|bn|usd)\b/g,"").replace(/[^a-z0-9. ]+/g," ").replace(/\s+/g," ").trim()}
function titaOk(q,a){
  var n=norm(a);if(!n)return false;
  var all=[q.answer].concat(q.accept||[]).map(norm);
  if(all.indexOf(n)>-1)return true;
  var x=parseFloat(n);if(!isNaN(x)&&/^[0-9.]+$/.test(n)){return all.some(function(t){var y=parseFloat(t);return /^[0-9.]+$/.test(t)&&!isNaN(y)&&Math.abs(x-y)<1e-9})}
  return false;
}
function openQuiz(id){
  var q=DB.quizzes.filter(function(x){return x.id===id})[0];if(!q)return;
  quiz={q:q,i:0,ans:q.questions.map(function(){return null}),sv:q.questions.map(function(){return false}),done:false,ask:false};
  drawQuiz();
}
function result(){
  var Q=quiz.q,sc=0,ok=0,wr=0,un=0;
  Q.questions.forEach(function(qq,i){
    var a=quiz.ans[i];
    if(a===null||a===""){un++;return}
    var good=Q.type==="MCQ"?a===qq.answer:titaOk(qq,a);
    if(good){ok++;sc+=1}else{wr++;if(Q.type==="MCQ")sc-=0.25}
  });
  return {score:sc,ok:ok,wr:wr,un:un};
}
function drawQuiz(){
  var Q=quiz.q,n=Q.questions.length,i=quiz.i,qq=Q.questions[i],mc=Q.type==="MCQ",R=quiz.done?result():null;
  var body="";
  if(quiz.done&&i===-1){
    body='<div class="qbody"><div class="tag">Result</div><div class="score">'+R.score+' / '+n+'</div><p>'+R.ok+' correct · '+R.wr+' wrong · '+R.un+' skipped'+(mc?" · marking +1 / −0.25":" · marking +1, no negative")+'</p><p>Open any question number below to review the answer and explanation.</p></div>';
  }else{
    var a=quiz.ans[i],opt="";
    if(mc){
      opt=qq.options.map(function(o,k){
        var cls="opt",chk=a===k;
        if(quiz.done){if(k===qq.answer)cls+=" ok";else if(chk)cls+=" no"}
        return '<button type="button" class="'+cls+'" role="radio" aria-checked="'+chk+'" data-opt="'+k+'"'+(quiz.done?" disabled":"")+'><span class="l">'+"ABCD".charAt(k)+'</span><span>'+esc(o)+'</span></button>';
      }).join("");
    }else{
      opt='<input class="tita" id="tita" type="text" autocomplete="off" placeholder="Type your answer" value="'+esc(a||"")+'"'+(quiz.done?" disabled":"")+'>';
      if(quiz.done){var g=titaOk(qq,a||"");opt+='<div class="expl" style="border-left:4px solid '+(g?"var(--good)":"var(--bad)")+'"><strong>'+(g?"Correct":"Answer")+':</strong> '+esc(qq.answer)+'</div>'}
    }
    body='<div class="qbody"><h3>Q'+(i+1)+'. '+esc(qq.q)+'</h3><div role="radiogroup">'+opt+'</div>'+(quiz.done?'<div class="expl"><strong>Explanation.</strong> '+esc(qq.explanation||"")+'</div>':"")+'</div>';
  }
  var pal=Q.questions.map(function(x,k){
    var c="";if(quiz.done){var v=quiz.ans[k],g=mc?v===x.answer:titaOk(x,v||"");c=(v===null||v==="")?"":(g?"ok":"no")}else if(quiz.sv[k])c="sv";
    return '<button type="button" class="'+c+(k===i?" cur":"")+'" data-q="'+k+'" aria-label="Question '+(k+1)+'">'+(k+1)+'</button>';
  }).join("");
  var answered=quiz.ans.filter(function(v){return v!==null&&v!==""}).length;
  var conf=quiz.ask?'<div class="confirm"><span>Submit now? '+answered+' of '+n+' answered.</span><span><button class="btn primary" id="q-yes">Yes, submit</button> <button class="btn" id="q-no">Keep working</button></span></div>':"";
  var foot=quiz.done?'<div class="qfoot"><button class="btn" id="q-prev"'+(i<=0?" disabled":"")+'>Previous</button><span><button class="btn" id="q-next"'+(i>=n-1?" disabled":"")+'>Next</button> <button class="btn primary" id="q-exit">Back to quizzes</button></span></div>'
    :'<div class="qfoot"><button class="btn" id="q-prev"'+(i===0?" disabled":"")+'>Previous</button><span><button class="btn primary" id="q-save">'+(i<n-1?"Save and Next":"Save")+'</button> <button class="btn" id="q-submit">Submit</button></span></div>';
  $("#view").innerHTML='<p class="crumb"><button class="btn" id="q-exit2">‹ All quizzes</button> &nbsp;'+esc(Q.type)+' · '+esc(Q.title)+'</p><div class="qwrap"><section class="pane pas" aria-label="Passage"><h2>Passage</h2><div class="pt">'+esc(Q.passage)+'</div></section><section class="pane qs" aria-label="Question"><div class="qhead"><span>Question '+(i<0?"–":i+1)+' of '+n+'</span><span>'+(quiz.done?"Review":answered+" answered")+'</span></div>'+body+conf+'<div class="pal">'+pal+'</div>'+foot+'</div></section></div>';
}
function saveCur(){
  var Q=quiz.q;if(quiz.done||quiz.i<0)return;
  if(Q.type==="TITA"){var el=$("#tita");if(el){var v=el.value.trim();quiz.ans[quiz.i]=v===""?null:v}}
  quiz.sv[quiz.i]=quiz.ans[quiz.i]!==null&&quiz.ans[quiz.i]!=="";
}
function finish(){
  saveCur();quiz.done=true;quiz.ask=false;quiz.i=-1;
  var R=result();store("best:"+quiz.q.id,R.score+"/"+quiz.q.questions.length);
  drawQuiz();
}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;
  if(t.dataset.mode){if(quiz)quiz=null;mode=t.dataset.mode;store("mode",mode);view();return}
  if(t.dataset.pick){var p=t.dataset.pick.split(":");var k=p[0],id=p.slice(1).join(":");
    if(k==="month"){F.month=id;F.chapter=F.topic=F.subtopic="";mode="chapter"}
    else if(k==="chapter"){F.chapter=id;F.month=DB.node[id].month;F.topic=F.subtopic="";mode="topic"}
    else if(k==="topic"){F.topic=id;F.chapter=DB.node[id].chapter;F.month=DB.node[id].month;F.subtopic="";mode="subtopic"}
    drawFilters();view();return}
  if(t.dataset.go){var g=t.dataset.go.split(":");F.subtopic=g[1];var nd=DB.node[g[1]];F.topic=nd.topic;F.chapter=nd.chapter;F.month=nd.month;mode=g[0];drawFilters();view();return}
  if(t.dataset.quiz){openQuiz(t.dataset.quiz);return}
  if(t.id==="f-reset"){F={month:"",chapter:"",topic:"",subtopic:"",q:""};drawFilters();view();return}
  if(t.id==="mm-all"){mmSet(true);return}
  if(t.id==="mm-none"){mmSet(false);return}
  if(!quiz)return;
  if(t.dataset.opt!==undefined&&!quiz.done){quiz.ans[quiz.i]=parseInt(t.dataset.opt,10);drawQuiz();return}
  if(t.dataset.q!==undefined){saveCur();quiz.i=parseInt(t.dataset.q,10);drawQuiz();return}
  if(t.id==="q-prev"){saveCur();quiz.i=Math.max(0,quiz.i-1);drawQuiz()}
  else if(t.id==="q-next"){quiz.i=Math.min(quiz.q.questions.length-1,quiz.i+1);drawQuiz()}
  else if(t.id==="q-save"){saveCur();if(quiz.i<quiz.q.questions.length-1)quiz.i++;drawQuiz()}
  else if(t.id==="q-submit"){saveCur();quiz.ask=true;drawQuiz()}
  else if(t.id==="q-no"){quiz.ask=false;drawQuiz()}
  else if(t.id==="q-yes"){finish()}
  else if(t.id==="q-exit"||t.id==="q-exit2"){quiz=null;view()}
});
document.addEventListener("click",function(e){
  var nd=e.target.closest(".nd.has");if(!nd)return;
  var br=nd.parentElement,kids=br.children[1];kids.hidden=!kids.hidden;br.classList.toggle("collapsed",kids.hidden);drawLines();
});
document.addEventListener("change",function(e){
  var id=e.target.id;
  if(id==="mm-pick"){mmSel=e.target.value;view();return}
  if(id&&id.indexOf("f-")===0&&id!=="f-q"){
    var k=id.slice(2);F[k]=e.target.value;
    if(k==="month"){F.chapter=F.topic=F.subtopic=""}
    if(k==="chapter"){F.topic=F.subtopic="";if(F.chapter)F.month=DB.node[F.chapter].month}
    if(k==="topic"){F.subtopic="";if(F.topic){F.chapter=DB.node[F.topic].chapter;F.month=DB.node[F.topic].month}}
    if(k==="subtopic"&&F.subtopic){var n=DB.node[F.subtopic];F.topic=n.topic;F.chapter=n.chapter;F.month=n.month}
    drawFilters();if(!quiz)view();
  }
});
var qT;
document.addEventListener("input",function(e){
  if(e.target.id==="f-q"){F.q=e.target.value;clearTimeout(qT);qT=setTimeout(function(){if(!quiz){var p=e.target.selectionStart;drawModes();view();var el=$("#f-q");el.focus();el.setSelectionRange(p,p)}},180)}
  else if(e.target.id==="tita"&&quiz){quiz.ans[quiz.i]=e.target.value.trim()===""?null:e.target.value.trim()}
});
document.addEventListener("keydown",function(e){
  if(e.target.id==="tita"&&e.key==="Enter"&&quiz&&!quiz.done){e.preventDefault();saveCur();if(quiz.i<quiz.q.questions.length-1)quiz.i++;drawQuiz();var el=$("#tita");if(el)el.focus()}
});
window.addEventListener("resize",function(){if(mode==="mindmap")drawLines()});

/* ---------- boot ---------- */
load().then(function(){
  var m=store("mode");if(m&&MODES.some(function(x){return x[0]===m}))mode=m;
  $("#sub").textContent="Current affairs from the monthly CLAT Express booklets · "+DB.months.length+" month"+(DB.months.length===1?"":"s")+" loaded";
  drawFilters();view();
}).catch(function(err){
  $("#view").innerHTML='<div class="err"><strong>The study data could not be loaded.</strong><br>'+esc(err.message)+'</div>';
});
})();
</script>
